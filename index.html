<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "green";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls (arrow keys)
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================
        const placeFood = () => {
            let onSnake = true;
            while (onSnake) {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                onSnake = false;
                for (const segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        onSnake = true;
                    }
                }
            }
        };
        const moveSnake = () => {
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                placeFood();
                score++;
                document.getElementById("info").textContent = `Score: ${score}`;
            } else {
                snake.pop();
            }
        };
        let highScore = Number(localStorage.getItem("highScore"));
        let gameOver = false;
        let isPaused = false;
        const isGameOver = () => {
            const head = snake[0];
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return true;
                }
            }
            return false;
        };
        const resetGame = () => {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            food = { x: 15, y: 15 };
            score = 0;
            gameOver = false;
            isPaused = false;
            document.getElementById("info").textContent = "Score: 0";
            gameInterval = setInterval(gameLoop, 150);
        };
        const gameLoop = () => {
            moveSnake();
            if (isGameOver()) {
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("highScore", highScore);
                }
                clearInterval(gameInterval);
                document.getElementById("info").textContent = "Game over! Score: " + score + ". High score: " + highScore + ". Press Space to restart.";
                gameOver = true;
                return;
            }
            drawGame();
        };
        let gameInterval = setInterval(gameLoop, 150);
        document.addEventListener("keydown", (event) => {
            if ((event.key === "p" || event.key === "P") && !gameOver)  {
                isPaused = !isPaused;
                if (isPaused) {
                    clearInterval(gameInterval);
                    document.getElementById("info").textContent = "Game paused. Press 'P' to resume.";
                } else {
                    gameInterval = setInterval(gameLoop, 150);
                    document.getElementById("info").textContent = "Score: " + score;
                }
            }
            if (event.key === " " && gameOver) {
                resetGame();
            }

            if (event.key === "ArrowUp" && direction.y !== 1) {
                direction = { x: 0, y: -1 };
            }
            else if (event.key === "ArrowDown" && direction.y !== -1) {
                direction = { x: 0, y: 1 };
            }
            else if (event.key === "ArrowLeft" && direction.x !== 1) {
                direction = { x: -1, y: 0 };
            }
            else if (event.key === "ArrowRight" && direction.x !== -1) {
                direction = { x: 1, y: 0 };
            }
        });

    </script>

</body>

</html>
